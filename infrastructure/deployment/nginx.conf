# Alternative front door if you prefer nginx over Caddy. Same routing contract:
# /api and /media to the API (so the browser sees one origin), everything else to Next.js.
upstream clipforge_api { server api:4000; keepalive 32; }
upstream clipforge_web { server web:3000; keepalive 32; }

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${CLIPFORGE_DOMAIN};

  ssl_certificate     /etc/letsencrypt/live/${CLIPFORGE_DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${CLIPFORGE_DOMAIN}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 512m;

  location /api/ {
    proxy_pass http://clipforge_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /media/ {
    proxy_pass http://clipforge_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
  }

  location / {
    proxy_pass http://clipforge_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
