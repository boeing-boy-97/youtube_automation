# Render blueprint — DASHBOARD BACKEND, $0 (self-contained).
#
# One Blueprint click creates everything the Vercel dashboard needs to sign in and work:
#   • clipforge-db     Render Postgres (free)        → DATABASE_URL
#   • clipforge-redis  Render Key Value (free)       → REDIS_URL
#   • clipforge-api    the NestJS API (free)         → https://clipforge-api.onrender.com
#
# No Neon, no Upstash, no R2 account, no values to paste. Migrations run on every deploy.
#
# What this does NOT include: the five BullMQ workers, the Python transcription service and the
# FFmpeg renderer. They cannot run on Render's free plan (background workers are paid-only), so
# uploads would sit at QUEUED. That full stack is `render.pipeline.yaml` — rename it to render.yaml
# when you are ready to pay for it.
#
# Caveats of the free tier, stated plainly:
#   • the API sleeps after 15 min idle; the first request afterwards takes ~30 s (the dashboard
#     shows "Checking your session…" meanwhile, and /healthz reports the probe honestly)
#   • free Postgres is deleted 30 days after creation — move to a paid plan for anything real
#   • storage is the container's /tmp: anything uploaded disappears on the next deploy
#
# After this deploy finishes: copy the API URL, put it in apps/web/api-target.json (or Vercel's
# API_INTERNAL_URL), and redeploy the dashboard. Full walk-through: docs/DEPLOY-VERCEL.md §2.

databases:
  - name: clipforge-db
    plan: free
    databaseName: clipforge
    user: clipforge
    ipAllowList: [] # internal network only

services:
  # Render Key Value — the BullMQ backend. Internal connections only.
  - type: keyvalue
    name: clipforge-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction # a queue must never evict a job to make room
    persistenceMode: off # not available on free instances

  # ------------------------------------------------------------------ the API
  - type: web
    name: clipforge-api
    runtime: docker
    dockerfilePath: ./infrastructure/docker/api.Dockerfile
    dockerContext: .
    plan: free # change to `starter` if you want no cold starts (and have a payment method)
    healthCheckPath: /api/system/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 4000
      - key: RUN_MIGRATIONS # the image applies prisma migrations before starting
        value: 1
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: info

      # --- the origin of the deployed dashboard. Change it if your Vercel domain differs. ---
      - key: APP_URL
        value: https://youtube-automation-delta-eosin.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://youtube-automation-delta-eosin.vercel.app

      # --- managed services created by this same blueprint ---
      - key: DATABASE_URL
        fromDatabase:
          name: clipforge-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: clipforge-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_PREFIX
        value: clipforge

      # --- secrets generated once, readable later in the Render dashboard ---
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_TOKEN # this is what you type into "First-run setup"
        generateValue: true
      - key: ALLOW_SELF_REGISTRATION
        value: false

      # --- storage: the container's /tmp (fine for a demo, wiped on deploy) ---
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: /tmp/clipforge/storage
      - key: STORAGE_LOCAL_PUBLIC_BASE_URL
        value: https://clipforge-api.onrender.com
      - key: WORK_DIR
        value: /tmp/clipforge/work

      # --- internal services that this free stack does not run ---
      # The API requires these to boot, so they point at nothing and every probe reports them
      # down, which is the truth. Add render.pipeline.yaml to make them real.
      - key: AI_ENGINE_URL
        value: https://ai-engine.not-deployed.invalid
      - key: AI_ENGINE_API_KEY
        generateValue: true
      - key: VIDEO_PROCESSOR_URL
        value: https://video-processor.not-deployed.invalid
      - key: VIDEO_PROCESSOR_API_KEY
        generateValue: true

      # --- optional: Telegram notifications (docs/TELEGRAM-NOTIFICATIONS.md) ---
      # Free, no third party. Leave blank to disable; the dashboard then reports the channel as
      # not configured and everything else keeps working.
      - key: TELEGRAM_BOT_TOKEN # @BotFather → /newbot → API token
        sync: false
      - key: TELEGRAM_CHAT_ID # e.g. -1001234567890 (group) or @channelusername
        sync: false

      # --- optional: Google sign-in (docs/FIREBASE-AUTH.md). Leave unset for password-only. ---
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_WEB_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_WEB_APP_ID
        sync: false
      - key: FIREBASE_ALLOW_NEW_USERS
        value: false
      - key: FIREBASE_REQUIRE_VERIFIED_EMAIL
        value: true

      # --- optional: Gemini for real transcripts/metadata (the pipeline needs it) ---
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_TEXT_MODEL
        value: gemini-2.0-flash
      - key: GEMINI_VISION_MODEL
        value: gemini-2.0-flash

      # --- queue/tuning ---
      - key: UPLOAD_PART_SIZE_MIB
        value: 16
      - key: WORKER_CONCURRENCY_AI
        value: 2
      - key: WORKER_CONCURRENCY_RENDER
        value: 1
      - key: WORKER_CONCURRENCY_PUBLISH
        value: 2
      - key: JOB_LEASE_SECONDS
        value: 900
      - key: JOB_HEARTBEAT_SECONDS
        value: 15
